apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: w9-api:1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ERROR_RATE
          value: "0"          # 0 = không lỗi
        - name: VERSION
          value: "v2"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
  strategy:
    canary:
      analysis:
        templates:
        - templateName: success-rate   # ← dùng AnalysisTemplate trên
        startingStep: 1                # bắt đầu chấm từ bước 1
      steps:
      - setWeight: 25
      - pause:
          duration: 2m                 # đợi 2 phút (đủ data cho analysis)
      - setWeight: 50
      - pause:
          duration: 2m
      - setWeight: 100

---

# ─── Service ───
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 8080
    targetPort: 8080