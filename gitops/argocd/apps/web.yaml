# file: gitops/argocd/apps/web.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  replicas: 4
  project: default                          # ← thêm dòng này
  source:
    repoURL: https://github.com/tuu-ngo/CICD_practice.git
    targetRevision: main
    path: gitops/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true