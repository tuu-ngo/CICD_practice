# file: gitops/argocd/apps/web.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/tuu-ngo/CICD_practice.git
    targetRevision: main
    path: gitops/k8s        # ← path trong repo (có prefix gitops/)
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true           # xóa resource nếu xóa file khỏi Git
      selfHeal: true        # tự sửa nếu ai kubectl edit tay