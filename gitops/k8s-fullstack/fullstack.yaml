# ─── Namespace ─── wave -1
apiVersion: v1
kind: Namespace
metadata:
  name: fullstack
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

---

# ─── Backend Deployment ─── wave 0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fullstack
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: w9-backend:1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: VERSION
          value: "v1"
        - name: ENV
          value: "production"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5

---

# ─── Backend Service ─── wave 0
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fullstack
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000

---

# ─── Frontend Deployment ─── wave 1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fullstack
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: w9-frontend:1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---

# ─── Frontend Service ─── wave 1
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fullstack
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
